name: Build Windows

# Builds the Windows port with PyInstaller on CI (free for public repos) and
# attaches the single .exe to the release that triggered the run. This is how
# the Windows .exe is produced at zero cost — no Windows machine required locally.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build for (e.g. v1.0.4). Defaults to the pushed tag, or v1.0.4 on manual run."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # On a tag push github.ref_name is "v1.0.4". On a manual dispatch it's
          # the branch name ("main"), so fall back to the input then a default.
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v="${{ github.ref_name }}"; fi
          case "$v" in
            v*) tag="$v" ;;
            *) tag="v$v" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved tag: $tag"

      - name: Install dependencies
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        working-directory: windows
        env:
          TN_VERSION: ${{ steps.ver.outputs.tag }}
        run: python build.py

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TN_VERSION: ${{ steps.ver.outputs.tag }}
        working-directory: windows
        run: |
          $tag = $env:TN_VERSION
          if (-not $tag -or $tag -eq "v") { $tag = "v1.0.4" }
          # Create the release if it doesn't already exist; ignore the error if it does.
          gh release create $tag --title "Tape Nexus $tag" --notes "Tape Nexus $tag" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "release $tag already exists" }
          # Upload whatever exe build.py produced.
          $exe = Get-ChildItem dist\TapeNexus-*-win64.exe | Select-Object -First 1
          gh release upload $tag $exe.FullName --clobber